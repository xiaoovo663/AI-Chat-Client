<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chat Client 2.0</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('aic2:theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f7f7f8;
  --bg-elev: #ffffff;
  --text: #1a1a1a;
  --text-dim: #6b7280;
  --border: #e5e7eb;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --user-bubble: #2563eb;
  --user-text: #ffffff;
  --ai-bubble: #f3f4f6;
  --danger: #dc2626;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #0f1115;
  --bg-soft: #16181d;
  --bg-elev: #1c1f26;
  --text: #e6e6e6;
  --text-dim: #9aa0aa;
  --border: #2a2e37;
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --user-bubble: #3b82f6;
  --user-text: #ffffff;
  --ai-bubble: #1c1f26;
  --danger: #f87171;
  --shadow: 0 4px 24px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100dvh; overflow: hidden; }
.sidebar {
  width: 264px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--bg-soft); border-right: 1px solid var(--border);
}
.sidebar-head {
  display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border);
}
.sidebar-head button {
  flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text); font-size: 13px; transition: .15s;
}
.sidebar-head button:hover { border-color: var(--accent); color: var(--accent); }
.sidebar-head .icon-btn { flex: 0 0 40px; }
.conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item {
  display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px;
  font-size: 13.5px; cursor: pointer; color: var(--text); transition: background .12s;
}
.conv-item:hover { background: var(--bg-elev); }
.conv-item.active { background: var(--bg-elev); box-shadow: inset 3px 0 0 var(--accent); }
.conv-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-del {
  flex-shrink: 0; width: 20px; height: 20px; line-height: 1; border: none; border-radius: 4px;
  background: transparent; color: var(--text-dim); opacity: 0; font-size: 15px;
}
.conv-item:hover .conv-del { opacity: 1; }
.conv-del:hover { background: var(--danger); color: #fff; }
.sidebar-foot { padding: 10px 12px; border-top: 1px solid var(--border); }
.sidebar-foot button {
  width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text); font-size: 13px;
}
.sidebar-foot button:hover { border-color: var(--accent); color: var(--accent); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.topbar .title {
  flex: 1; font-size: 14px; font-weight: 600; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.topbar .actions { display: flex; gap: 6px; }
.topbar .actions button {
  padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text-dim); font-size: 12px;
}
.topbar .actions button:hover { color: var(--accent); border-color: var(--accent); }
#btnMenu { display: none; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-elev); }
.banner {
  display: none; padding: 8px 16px; font-size: 12.5px;
  background: #fef3c7; color: #92400e; border-bottom: 1px solid #fde68a;
}
[data-theme="dark"] .banner { background: #422006; color: #fcd34d; border-bottom-color: #713f12; }
.banner.show { display: block; }
.messages { flex: 1; overflow-y: auto; padding: 20px 16px 8px; scroll-behavior: smooth; }
.msg { display: flex; margin: 0 auto 18px; max-width: 860px; }
.msg-user { justify-content: flex-end; }
.bubble {
  max-width: min(720px, 88%); padding: 11px 15px; border-radius: var(--radius);
  line-height: 1.7; word-break: break-word; overflow-wrap: anywhere;
}
.msg-user .bubble {
  background: var(--user-bubble); color: var(--user-text);
  border-bottom-right-radius: 4px; white-space: pre-wrap;
}
.msg-assistant .bubble { background: var(--ai-bubble); border-bottom-left-radius: 4px; }
.bubble.markdown > :first-child { margin-top: 0; }
.bubble.markdown > :last-child { margin-bottom: 0; }
.bubble.markdown p { margin: 0 0 10px; }
.bubble.markdown ul, .bubble.markdown ol { margin: 0 0 10px; padding-left: 22px; }
.bubble.markdown li { margin: 3px 0; }
.bubble.markdown h1, .bubble.markdown h2, .bubble.markdown h3 {
  margin: 16px 0 8px; font-size: 1.15em; line-height: 1.4;
}
.bubble.markdown h1 { font-size: 1.3em; }
.bubble.markdown blockquote {
  margin: 0 0 10px; padding: 2px 12px; border-left: 3px solid var(--border); color: var(--text-dim);
}
.bubble.markdown table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
.bubble.markdown th, .bubble.markdown td { border: 1px solid var(--border); padding: 5px 10px; }
.bubble.markdown code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px; background: rgba(127,127,127,.15); padding: 2px 5px; border-radius: 4px;
}
.bubble.markdown pre {
  position: relative; margin: 0 0 10px; padding: 13px 14px; border-radius: 9px;
  background: #0d1117; overflow-x: auto;
}
.bubble.markdown pre code {
  background: none; padding: 0; font-size: 13px; line-height: 1.6; color: #c9d1d9;
}
.code-copy {
  position: absolute; top: 7px; right: 7px; padding: 3px 9px; font-size: 11px;
  border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9;
  opacity: 0; transition: opacity .15s;
}
.bubble.markdown pre:hover .code-copy { opacity: 1; }
.code-copy:hover { background: #21262d; }
.jump-latest {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg-elev); color: var(--text); font-size: 12.5px;
  box-shadow: var(--shadow); z-index: 5;
}
.jump-latest[hidden] { display: none; }
.composer {
  display: flex; gap: 8px; align-items: flex-end; padding: 12px 16px 16px;
  border-top: 1px solid var(--border); background: var(--bg);
}
.composer-inner {
  flex: 1; max-width: 860px; margin: 0 auto; display: flex; gap: 8px;
  align-items: flex-end; width: 100%;
}
#input {
  flex: 1; resize: none; min-height: 44px; max-height: 200px; padding: 11px 14px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--bg-elev);
  color: var(--text); line-height: 1.5; outline: none; transition: border-color .15s;
}
#input:focus { border-color: var(--accent); }
#btnSend, #btnStop {
  flex-shrink: 0; height: 44px; padding: 0 20px; border-radius: 12px; border: none;
  background: var(--accent); color: #fff; font-weight: 500; transition: background .15s;
}
#btnSend:hover { background: var(--accent-hover); }
#btnStop { background: var(--danger); }
#btnSend[hidden], #btnStop[hidden] { display: none; }
.modal {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,.45);
}
.modal.show { display: flex; }
.modal-card {
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  background: var(--bg-elev); border-radius: 14px; padding: 22px; box-shadow: var(--shadow);
}
.modal-card h2 { margin: 0 0 6px; font-size: 17px; }
.modal-card .hint { margin: 0 0 18px; font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); outline: none; font-size: 13.5px;
}
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 68px; line-height: 1.6; }
.key-wrap { position: relative; }
.key-wrap input { padding-right: 60px; }
.key-toggle {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--text-dim); font-size: 12px; padding: 4px 8px;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal-actions button { padding: 9px 18px; border-radius: 8px; font-size: 13.5px; }
.btn-ghost { border: 1px solid var(--border); background: transparent; color: var(--text); }
.btn-primary { border: none; background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.toast-wrap {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.toast {
  padding: 9px 18px; border-radius: 9px; font-size: 13px; color: #fff;
  background: #1f2937; box-shadow: var(--shadow); animation: toastIn .2s ease;
}
.toast.error { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }
@media (max-width: 760px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 60;
    transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: none; }
  #btnMenu { display: block; }
  .topbar .actions button { padding: 5px 8px; font-size: 11.5px; }
  .messages { padding: 16px 12px 8px; }
  .composer { padding: 10px 12px 14px; }
  .bubble { max-width: 94%; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button id="btnNew">＋ 新对话</button>
      <button id="btnTheme" class="icon-btn" title="切换主题">◐</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-foot">
      <button id="btnSettings">⚙ 设置</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="btnMenu">☰</button>
      <div class="title" id="convTitle">新对话</div>
      <div class="actions">
        <button id="btnExportMd">导出 MD</button>
        <button id="btnExportJson">导出 JSON</button>
      </div>
    </header>
    <div class="banner" id="banner"></div>
    <div class="messages" id="messages"></div>
    <button class="jump-latest" id="jumpLatest" hidden>↓ 回到最新</button>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="btnSend">发送</button>
        <button id="btnStop" hidden>停止</button>
      </div>
    </div>
  </main>
</div>
<div class="modal" id="settingsModal">
  <div class="modal-card">
    <h2>设置</h2>
    <p class="hint">配置仅保存在本机浏览器，不会上传到任何服务器。请勿在公共电脑上使用。</p>
    <div class="field">
      <label>API Base URL</label>
      <input id="setBaseUrl" placeholder="https://api.openai.com/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <div class="key-wrap">
        <input id="setApiKey" type="password" placeholder="sk-...">
        <button class="key-toggle" id="btnToggleKey">显示</button>
      </div>
    </div>
    <div class="field">
      <label>模型</label>
      <input id="setModel" placeholder="gpt-4o-mini">
    </div>
    <div class="field">
      <label>系统提示词（可选）</label>
      <textarea id="setSystem" placeholder="例如：你是一个简洁、准确的中文助手。"></textarea>
    </div>
    <div class="field">
      <label>上下文预算（字符数）</label>
      <input id="setBudget" type="number" min="500" step="500" placeholder="6000">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="btnCloseSettings">取消</button>
      <button class="btn-primary" id="btnSaveSettings">保存</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script>
(function () {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => (crypto.randomUUID
  ? crypto.randomUUID()
  : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));
const Store = (() => {
  let mode = 'idb';
  let db = null;
  const K_CONV = 'aic2:conversations';
  const K_MSG = 'aic2:messages';
  function reqToPromise(req) {
    return new Promise((res, rej) => {
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  function openIdb() {
    return new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open('ai-chat-2', 1); }
      catch (e) { return reject(e); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('conversations')) {
          d.createObjectStore('conversations', { keyPath: 'id' });
        }
        if (!d.objectStoreNames.contains('messages')) {
          const s = d.createObjectStore('messages', { keyPath: 'id' });
          s.createIndex('conversationId', 'conversationId');
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
  }
  const ls = {
    read(k, def) {
      try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
      catch { return def; }
    },
    write(k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); }
      catch (e) { console.warn('[store] localStorage 写入失败', e); toast('本地存储已满', true); }
    }
  };
  return {
    async init() {
      try { db = await openIdb(); mode = 'idb'; }
      catch (e) {
        mode = 'ls';
        console.warn('[store] IndexedDB 不可用，降级 localStorage', e);
      }
    },
    async listConversations() {
      if (mode === 'idb') {
        const all = await reqToPromise(
          db.transaction('conversations', 'readonly').objectStore('conversations').getAll()
        );
        return all.sort((a, b) => b.updatedAt - a.updatedAt);
      }
      return ls.read(K_CONV, []).sort((a, b) => b.updatedAt - a.updatedAt);
    },
    async saveConversation(c) {
      if (mode === 'idb') {
        await reqToPromise(
          db.transaction('conversations', 'readwrite').objectStore('conversations').put(c)
        );
        return;
      }
      const all = ls.read(K_CONV, []);
      const i = all.findIndex(x => x.id === c.id);
      if (i >= 0) all[i] = c; else all.push(c);
      ls.write(K_CONV, all);
    },
    async removeConversation(id) {
      if (mode === 'idb') {
        await reqToPromise(
          db.transaction('conversations', 'readwrite').objectStore('conversations').delete(id)
        );
      } else {
        ls.write(K_CONV, ls.read(K_CONV, []).filter(x => x.id !== id));
      }
      await this.removeMessages(id);
    },
    async listMessages(convId) {
      if (mode === 'idb') {
        const idx = db.transaction('messages', 'readonly').objectStore('messages').index('conversationId');
        const all = await reqToPromise(idx.getAll(convId));
        return all.sort((a, b) => a.ts - b.ts);
      }
      return (ls.read(K_MSG, {})[convId] || []).sort((a, b) => a.ts - b.ts);
    },
    async saveMessage(m) {
      if (mode === 'idb') {
        await reqToPromise(
          db.transaction('messages', 'readwrite').objectStore('messages').put(m)
        );
        return;
      }
      const all = ls.read(K_MSG, {});
      const arr = all[m.conversationId] || (all[m.conversationId] = []);
      const i = arr.findIndex(x => x.id === m.id);
      if (i >= 0) arr[i] = m; else arr.push(m);
      ls.write(K_MSG, all);
    },
    async removeMessage(id, convId) {
      if (mode === 'idb') {
        await reqToPromise(
          db.transaction('messages', 'readwrite').objectStore('messages').delete(id)
        );
        return;
      }
      const all = ls.read(K_MSG, {});
      if (all[convId]) {
        all[convId] = all[convId].filter(x => x.id !== id);
        ls.write(K_MSG, all);
      }
    },
    async removeMessages(convId) {
      if (mode === 'idb') {
        const os = db.transaction('messages', 'readwrite').objectStore('messages');
        const keys = await reqToPromise(os.index('conversationId').getAllKeys(convId));
        await Promise.all(keys.map(k => reqToPromise(os.delete(k))));
        return;
      }
      const all = ls.read(K_MSG, {});
      delete all[convId];
      ls.write(K_MSG, all);
    }
  };
})();
const DEFAULTS = {
  baseUrl: 'https://api.openai.com/v1',
  apiKey: '',
  model: 'gpt-4o-mini',
  systemPrompt: '',
  budget: 6000
};
let settings = Object.assign({}, DEFAULTS, (() => {
  try { return JSON.parse(localStorage.getItem('aic2:settings') || '{}'); }
  catch { return {}; }
})());
function saveSettings() {
  try { localStorage.setItem('aic2:settings', JSON.stringify(settings)); }
  catch (e) { console.warn(e); }
}
if (window.marked) {
  try {
    window.marked.setOptions({ breaks: true, gfm: true });
    if (window.hljs) {
      window.marked.use({
        renderer: {
          code(code, lang) {
            const valid = lang && window.hljs.getLanguage(lang);
            const html = valid
              ? window.hljs.highlight(code, { language: lang }).value
              : escapeHtml(code);
            return `<pre><code class="hljs${valid ? ' language-' + escapeHtml(lang) : ''}">${html}</code></pre>`;
          }
        }
      });
    }
  } catch (e) { console.warn('[markdown] 配置失败', e); }
}
function renderMarkdown(text) {
  if (!text) return '';
  if (!window.marked || text.length > 30000) {
    return escapeHtml(text).replace(/\n/g, '<br>');
  }
  let html;
  try { html = window.marked.parse(text); }
  catch { html = escapeHtml(text).replace(/\n/g, '<br>'); }
  if (window.DOMPurify) {
    html = window.DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
  }
  return html;
}
function enhanceCode(root) {
  root.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.code-copy')) return;
    const btn = document.createElement('button');
    btn.className = 'code-copy';
    btn.textContent = '复制';
    btn.addEventListener('click', async () => {
      const code = pre.querySelector('code');
      if (!code) return;
      try {
        await navigator.clipboard.writeText(code.innerText);
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = '复制'; }, 1200);
      } catch { toast('复制失败', true); }
    });
    pre.appendChild(btn);
  });
}
const els = {
  sidebar: $('#sidebar'),
  convList: $('#convList'),
  convTitle: $('#convTitle'),
  messages: $('#messages'),
  input: $('#input'),
  btnSend: $('#btnSend'),
  btnStop: $('#btnStop'),
  jumpLatest: $('#jumpLatest'),
  banner: $('#banner'),
  settingsModal: $('#settingsModal'),
  toastWrap: $('#toastWrap')
};
let convs = [];
let currentConv = null;
let history = [];
let busy = false;
let currentController = null;
let streamingEl = null;
let streamingText = '';
let rafId = null;
function toast(msg, isError) {
  const div = document.createElement('div');
  div.className = 'toast' + (isError ? ' error' : '');
  div.textContent = msg;
  els.toastWrap.appendChild(div);
  setTimeout(() => {
    div.style.opacity = '0';
    div.style.transition = 'opacity .2s';
    setTimeout(() => div.remove(), 220);
  }, 2200);
}
function pushDelta(delta) {
  streamingText += delta;
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = null;
    flushRender();
  });
}
function flushRender() {
  if (!streamingEl) return;
  streamingEl.innerHTML = renderMarkdown(streamingText);
  enhanceCode(streamingEl);
  smartScroll();
}
function nearBottom() {
  const m = els.messages;
  return m.scrollHeight - m.scrollTop - m.clientHeight < 90;
}
function smartScroll(force) {
  if (force || nearBottom()) {
    els.messages.scrollTop = els.messages.scrollHeight;
  }
}
els.messages.addEventListener('scroll', () => {
  els.jumpLatest.hidden = nearBottom();
});
els.jumpLatest.addEventListener('click', () => {
  els.messages.scrollTop = els.messages.scrollHeight;
  els.jumpLatest.hidden = true;
});
function appendMsg(m) {
  const wrap = document.createElement('div');
  wrap.className = 'msg msg-' + m.role;
  wrap.dataset.id = m.id;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (m.role === 'assistant' ? ' markdown' : '');
  if (m.role === 'assistant') {
    bubble.innerHTML = renderMarkdown(m.content || '');
    enhanceCode(bubble);
  } else {
    bubble.textContent = m.content;
  }
  wrap.appendChild(bubble);
  els.messages.appendChild(wrap);
  smartScroll(true);
  return wrap;
}
function clearMessages() {
  els.messages.innerHTML = '';
}
function renderConvList() {
  els.convList.innerHTML = '';
  convs.forEach(c => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (currentConv && currentConv.id === c.id ? ' active' : '');
    item.dataset.id = c.id;
    const name = document.createElement('span');
    name.className = 'conv-name';
    name.textContent = c.title || '新对话';
    const del = document.createElement('button');
    del.className = 'conv-del';
    del.textContent = '×';
    del.title = '删除会话';
    item.appendChild(name);
    item.appendChild(del);
    els.convList.appendChild(item);
  });
}
els.convList.addEventListener('click', async e => {
  const item = e.target.closest('.conv-item');
  if (!item) return;
  const id = item.dataset.id;
  if (e.target.closest('.conv-del')) {
    if (!confirm('确定删除这个会话？此操作不可恢复。')) return;
    await Store.removeConversation(id);
    convs = convs.filter(c => c.id !== id);
    if (currentConv && currentConv.id === id) {
      currentConv = null;
      history = [];
      clearMessages();
      els.convTitle.textContent = '新对话';
    }
    renderConvList();
    return;
  }
  if (currentConv && currentConv.id === id) return;
  await loadConversation(id);
  if (window.innerWidth <= 760) els.sidebar.classList.remove('open');
});
async function loadConversation(id) {
  if (busy && currentController) currentController.abort();
  const conv = convs.find(c => c.id === id);
  if (!conv) return;
  currentConv = conv;
  els.convTitle.textContent = conv.title || '新对话';
  clearMessages();
  history = await Store.listMessages(id);
  history.forEach(m => appendMsg(m));
  renderConvList();
  smartScroll(true);
}
async function createConversation(silent) {
  if (currentConv && history.length === 0) return currentConv;
  const conv = {
    id: uid(),
    title: '新对话',
    model: settings.model,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  convs.unshift(conv);
  await Store.saveConversation(conv);
  currentConv = conv;
  history = [];
  clearMessages();
  els.convTitle.textContent = conv.title;
  renderConvList();
  if (!silent) els.input.focus();
  return conv;
}
async function newConversation() {
  if (busy) { toast('请先停止当前生成'); return; }
  if (currentConv && history.length === 0) { els.input.focus(); return; }
  await createConversation();
  if (window.innerWidth <= 760) els.sidebar.classList.remove('open');
}
$('#btnNew').addEventListener('click', newConversation);
function buildContext(messages, system) {
  const out = [];
  if (system && system.trim()) {
    out.push({ role: 'system', content: system.trim() });
  }
  const valid = messages.filter(m => m.content && m.content.trim());
  const budget = Math.max(500, Number(settings.budget) || 6000);
  let used = 0;
  const picked = [];
  for (let i = valid.length - 1; i >= 0; i--) {
    const m = valid[i];
    const len = m.content.length;
    if (picked.length > 0 && used + len > budget) break;
    picked.unshift({ role: m.role, content: m.content });
    used += len;
  }
  return out.concat(picked);
}
const NO_DATA_TIMEOUT = 25000;
function friendlyError(e) {
  if (e.status === 401 || e.status === 403) return 'API Key 无效或权限不足，请检查设置';
  if (e.status === 404) return '接口不存在（404），请检查 Base URL 是否包含 /v1';
  if (e.status === 429) return '请求过于频繁（429），请稍后重试';
  if (e.status >= 500) return `服务端异常（${e.status}），请稍后重试`;
  if (e.name === 'TypeError') return '网络请求失败：地址错误、网络中断或被 CORS 拦截';
  return e.message || '请求失败';
}
async function doStream(ctx) {
  const controller = new AbortController();
  currentController = controller;
  let timer = null;
  let timedOut = false;
  const resetTimer = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      timedOut = true;
      controller.abort();
    }, NO_DATA_TIMEOUT);
  };
  resetTimer();
  const base = (settings.baseUrl || '').replace(/\/+$/, '');
  let res;
  try {
    res = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + settings.apiKey
      },
      body: JSON.stringify({
        model: settings.model,
        messages: ctx,
        stream: true
      }),
      signal: controller.signal
    });
  } catch (e) {
    clearTimeout(timer);
    currentController = null;
    if (timedOut) { const err = new Error('超时'); err.name = 'AbortError'; err.timeout = true; throw err; }
    throw e;
  }
  if (!res.ok) {
    clearTimeout(timer);
    currentController = null;
    let detail = '';
    try {
      const j = await res.json();
      detail = (j.error && j.error.message) || '';
    } catch {}
    const err = new Error(detail || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  streamingText = '';
  if (streamingEl) streamingEl.innerHTML = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      resetTimer();
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        if (data === '[DONE]') return;
        let json;
        try { json = JSON.parse(data); } catch { continue; }
        const delta = json.choices && json.choices[0] && json.choices[0].delta;
        if (delta && typeof delta.content === 'string' && delta.content) {
          pushDelta(delta.content);
        }
      }
    }
  } catch (e) {
    if (timedOut) {
      const err = new Error('超时');
      err.name = 'AbortError';
      err.timeout = true;
      throw err;
    }
    throw e;
  } finally {
    clearTimeout(timer);
    currentController = null;
  }
}
async function withRetry(fn) {
  for (let attempt = 0; ; attempt++) {
    try { return await fn(); }
    catch (e) {
      if (e.name === 'AbortError') throw e;
      const retriable = e.status === 429 || (e.status >= 500 && e.status < 600);
      if (!retriable || attempt >= 2) throw e;
      await sleep(1000 * Math.pow(2, attempt));
      toast('请求失败，正在重试（' + (attempt + 1) + '/2）');
      if (streamingEl) { streamingText = ''; streamingEl.innerHTML = ''; }
    }
  }
}
function setBusy(b) {
  busy = b;
  els.btnSend.hidden = b;
  els.btnStop.hidden = !b;
}
async function send() {
  if (busy) return;
  const text = els.input.value.trim();
  if (!text) return;
  if (!settings.apiKey) {
    toast('请先在设置中填写 API Key', true);
    openSettings();
    return;
  }
  let conv = currentConv || await createConversation(true);
  els.input.value = '';
  autoResize();
  const userMsg = {
    id: uid(),
    conversationId: conv.id,
    role: 'user',
    content: text,
    ts: Date.now()
  };
  history.push(userMsg);
  await Store.saveMessage(userMsg);
  appendMsg(userMsg);
  if (!conv.title || conv.title === '新对话') {
    conv.title = text.slice(0, 20) + (text.length > 20 ? '…' : '');
    els.convTitle.textContent = conv.title;
  }
  conv.updatedAt = Date.now();
  await Store.saveConversation(conv);
  renderConvList();
  const aiMsg = {
    id: uid(),
    conversationId: conv.id,
    role: 'assistant',
    content: '',
    ts: Date.now() + 1
  };
  history.push(aiMsg);
  const node = appendMsg(aiMsg);
  streamingEl = node.querySelector('.bubble');
  setBusy(true);
  const ctx = buildContext(history.slice(0, -1), settings.systemPrompt);
  try {
    await withRetry(() => doStream(ctx));
  } catch (e) {
    if (e.name === 'AbortError') {
      toast(e.timeout ? '响应超时，已停止' : '已停止生成');
    } else {
      toast(friendlyError(e), true);
    }
  } finally {
    setBusy(false);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    flushRender();
    aiMsg.content = streamingText;
    if (aiMsg.content) {
      aiMsg.ts = Date.now();
      await Store.saveMessage(aiMsg);
    } else {
      history.pop();
      node.remove();
    }
    conv.updatedAt = Date.now();
    await Store.saveConversation(conv);
    renderConvList();
    streamingEl = null;
    streamingText = '';
    els.input.focus();
  }
}
function autoResize() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 200) + 'px';
}
els.input.addEventListener('input', autoResize);
els.input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
els.btnSend.addEventListener('click', send);
els.btnStop.addEventListener('click', () => {
  if (currentController) currentController.abort();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && busy && currentController) {
    currentController.abort();
  }
});
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function safeName(s) {
  return String(s || 'conversation')
    .replace(/[\\/:*?"<>|]/g, '_')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 60) || 'conversation';
}
async function currentMessages() {
  if (!currentConv) return [];
  return Store.listMessages(currentConv.id);
}
$('#btnExportMd').addEventListener('click', async () => {
  if (!currentConv) { toast('当前没有会话'); return; }
  const msgs = await currentMessages();
  if (!msgs.length) { toast('当前会话没有消息'); return; }
  const lines = [
    '# ' + (currentConv.title || '对话'),
    '',
    '> 模型：' + (currentConv.model || settings.model) +
    ' · 导出时间：' + new Date().toISOString(),
    ''
  ];
  msgs.forEach(m => {
    lines.push('---', '');
    lines.push(m.role === 'user' ? '## 🧑 用户' : '## 🤖 助手');
    lines.push('');
    lines.push(m.content);
    lines.push('');
  });
  download(safeName(currentConv.title) + '.md', lines.join('\n'), 'text/markdown;charset=utf-8');
  toast('已导出 Markdown');
});
$('#btnExportJson').addEventListener('click', async () => {
  if (!currentConv) { toast('当前没有会话'); return; }
  const msgs = await currentMessages();
  if (!msgs.length) { toast('当前会话没有消息'); return; }
  const data = {
    conversation: currentConv,
    messages: msgs,
    exportedAt: new Date().toISOString()
  };
  download(safeName(currentConv.title) + '.json',
    JSON.stringify(data, null, 2),
    'application/json;charset=utf-8');
  toast('已导出 JSON');
});
function openSettings() {
  $('#setBaseUrl').value = settings.baseUrl || '';
  $('#setApiKey').value = settings.apiKey || '';
  $('#setModel').value = settings.model || '';
  $('#setSystem').value = settings.systemPrompt || '';
  $('#setBudget').value = settings.budget || 6000;
  $('#setApiKey').type = 'password';
  $('#btnToggleKey').textContent = '显示';
  els.settingsModal.classList.add('show');
}
function closeSettings() {
  els.settingsModal.classList.remove('show');
}
$('#btnSettings').addEventListener('click', openSettings);
$('#btnCloseSettings').addEventListener('click', closeSettings);
els.settingsModal.addEventListener('click', e => {
  if (e.target === els.settingsModal) closeSettings();
});
$('#btnToggleKey').addEventListener('click', () => {
  const inp = $('#setApiKey');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  $('#btnToggleKey').textContent = show ? '隐藏' : '显示';
});
$('#btnSaveSettings').addEventListener('click', () => {
  settings.baseUrl = $('#setBaseUrl').value.trim() || DEFAULTS.baseUrl;
  settings.apiKey = $('#setApiKey').value.trim();
  settings.model = $('#setModel').value.trim() || DEFAULTS.model;
  settings.systemPrompt = $('#setSystem').value;
  settings.budget = Math.max(500, Number($('#setBudget').value) || 6000);
  saveSettings();
  closeSettings();
  toast('设置已保存');
});
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('aic2:theme', t); } catch {}
}
$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
});
$('#btnMenu').addEventListener('click', () => {
  els.sidebar.classList.toggle('open');
});
if (location.protocol === 'file:') {
  els.banner.textContent = '当前以 file:// 打开。部分 API 会被浏览器 CORS 拦截，若请求失败请改用本地 HTTP 服务器或在线部署版。';
  els.banner.classList.add('show');
}
if (location.protocol !== 'file:') {
  try {
    const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="96" fill="#2563eb"/>
      <text x="256" y="330" font-size="230" text-anchor="middle" fill="#fff" font-family="sans-serif">AI</text>
    </svg>`;
    const icon = 'data:image/svg+xml,' + encodeURIComponent(iconSvg);
    const manifest = {
      name: 'AI Chat Client',
      short_name: 'AI Chat',
      start_url: location.pathname,
      scope: './',
      display: 'standalone',
      background_color: '#0f1115',
      theme_color: '#2563eb',
      icons: [{ src: icon, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
  } catch (e) { console.warn('[pwa] manifest 生成失败', e); }
}
async function boot() {
  await Store.init();
  try {
    convs = await Store.listConversations();
  } catch (e) {
    console.warn('[boot] 读取会话失败', e);
    convs = [];
  }
  renderConvList();
  if (convs.length) {
    await loadConversation(convs[0].id);
  } else {
    els.convTitle.textContent = '新对话';
  }
  if (!settings.apiKey) {
    setTimeout(() => toast('首次使用，请先点击「设置」填写 API Key'), 400);
  }
  els.input.focus();
}
boot();
})();
</script>
